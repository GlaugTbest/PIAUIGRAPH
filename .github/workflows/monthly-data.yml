name: Monthly official data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 5 * *'
permissions:
  contents: write
concurrency:
  group: official-data-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ephemeral-ci-only-password
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
        options: --health-cmd "cypher-shell -u neo4j -p ephemeral-ci-only-password 'RETURN 1'" --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ephemeral-ci-only-password
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/official
          key: official-${{ github.run_id }}
          restore-keys: official-
      - run: npm run data:update -- --catalog
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Publish verified source snapshot
        run: |
          git config user.name 'PIAUIGRAPH Data'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/active.json data/releases public/geo
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh verified official procurement snapshot'
          git push
